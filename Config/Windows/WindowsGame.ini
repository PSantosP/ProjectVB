; Windows 의 키 그림 대응표(CommonInput 컨트롤러 데이터). Lyra Config/Windows/WindowsGame.ini 와 같은 섹션 - 키보드·마우스, 패드 XSX, 패드 PS5 셋
;   (설계 Docs/Implementation/CodeAudit/Design_L3d_KeyIcons.md 3절 4번). 경로가 틀리면 엔진은 경고 없이 그림을 못 찾는다 - VB.Unit.Input.KeyIcon 이 막는다.
[CommonInputPlatformSettings_Windows CommonInputPlatformSettings]
DefaultInputType=MouseAndKeyboard
bSupportsMouseAndKeyboard=True
bSupportsTouch=False
bSupportsGamepad=True
DefaultGamepadName=XSX
bCanChangeGamepadType=True
+ControllerData=/Game/VB/UI/Input/ControllerData/BP_VBControllerData_KeyboardMouse.BP_VBControllerData_KeyboardMouse_C
+ControllerData=/Game/VB/UI/Input/ControllerData/BP_VBControllerData_GamepadXSX.BP_VBControllerData_GamepadXSX_C
+ControllerData=/Game/VB/UI/Input/ControllerData/BP_VBControllerData_GamepadPS5.BP_VBControllerData_GamepadPS5_C
