;   ParryDelayMs=670 is measured (run 20261023_174407_FighterRiposte, 22 tries): BP_EnemySoldierCombo's first hit lands 63-65 frames after
;   its attack starts and the human reaction adds 14-22 frames, so a 0 delay guards and lets go before the hit; 670 ms puts the guard start
;   inside the 0.15 s parry window for that whole reaction spread.
;   Guard after each soldier attack start; after a confirmed parry press the light attack inside State.Combat.RiposteWindow, let go and
;   watch the recovery. Three ripostes with recovery observed; the montage that actually played is recorded per try and
;   AM_Fighter_Riposte_R must be among them (not assumed from the try number). GuardParry stays the Katana G0 baseline, untouched.
